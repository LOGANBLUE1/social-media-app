spring.application.name=logan

# Every deployable value reads from the environment with a localhost-friendly default, so running
# from an IDE needs no setup and the container needs no baked-in config. The one exception is
# JWT_SECRET, which has no usable default on purpose -- see JWTTokenProvider.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/logandb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is owned by the SQL files in db/migration, now applied by Flyway on startup rather
# than by hand. `validate` stays on as the cross-check: Flyway guarantees the migrations ran,
# Hibernate guarantees the result is actually the schema the entities expect.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Adopting Flyway into databases that already have the schema.
#
# baseline-on-migrate only applies to a NON-EMPTY schema with no history table -- i.e. the existing
# development database, where V1-V4 were applied by hand. There, Flyway stamps the history at
# baseline-version and skips straight to V5, rather than re-running four migrations against tables
# that already exist.
#
# An EMPTY database (a fresh EC2 box) is untouched by this and runs V1-V4 normally, which is the
# path that actually matters for deployment.
#
# Once every database has a history table this pair is inert; it is a one-time adoption aid, not
# something to keep bumping. Raising baseline-version later would silently skip real migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4

# Access token lifetime, in MILLISECONDS (JWTTokenProvider adds it to System.currentTimeMillis).
# 15 minutes. Short on purpose -- the client refreshes transparently on a 401, so the only cost of
# a short window is an occasional extra round trip, while the benefit is that a leaked token dies.
question.expires.in=900000

# Refresh token lifetime, in SECONDS (RefreshTokenService uses plusSeconds) -- note the different
# unit to the line above; that mismatch is why these two values look comparable and are not.
# 30 days, and sliding: every refresh pushes it back out, so only a genuinely idle user is signed
# out. Previously 700000 seconds, i.e. 8 days from login regardless of use.
refresh.token.expires.in=2592000

# Signing key for access tokens. Base64, at least 256 bits. Generate with:
#   openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:}

# Browser origins allowed to call this API. The deployed client is an https:// page, so it must be
# listed here exactly -- scheme and host, no trailing slash. Comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool