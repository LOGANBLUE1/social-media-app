# The whole backend for one EC2 box: API and database side by side.
#
# Values come from a .env file sitting next to this one (see .env.example). Nothing secret is
# written here, so this file is safe to commit.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately no `ports:`. The database is reachable from the api service over the compose
    # network and from nowhere else -- publishing 5432 would expose it to the internet, since the
    # EC2 security group governs the host, not the container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        # Not just "started": Flyway runs during startup, and a database still initialising means
        # the api dies on boot. It would be restarted into a working state, but the first deploy
        # then looks like a failure for no reason.
        condition: service_healthy
    environment:
      # `postgres` is the service name, resolved on the compose network.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      # Bound to the host so CloudFront can reach it. CloudFront allows custom origin ports of
      # 80, 443, and 1024-65535, so 8080 works directly and there is no nginx in the picture.
      - "8080:8080"

volumes:
  pgdata:
